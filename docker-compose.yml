services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gov
      POSTGRES_PASSWORD: gov
      POSTGRES_DB: governance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://gov:gov@db:5432/governance
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost,http://localhost:80
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
